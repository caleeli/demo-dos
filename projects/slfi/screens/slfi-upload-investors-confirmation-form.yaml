title: slfi-upload-investors-confirmation-form
description: Upload information of the investors
type: FORM
config:
  - name: Upload Investors Confirmation Form
    items:
      - uuid: a1111111-1111-4111-8111-111111111101
        component: VueComponentRenderTemplate
        editor-component: VueComponentEditor
        editor-control: VueComponentEditor
        label: Vue component Editor
        inspector: []
        config:
          icon: fas fa-pencil-ruler
          interactive: true
          componentName: UploadInvestorsConfirmationForm
          contentVue: '<UploadInvestorsConfirmationForm v-model="data" :submit="submit" />'
          handlerVue: |
            return {
              created() {
                if (!this.data) { return; }
                const keys = ['SLFI_CURRENT_DATE','SLFI_SUBMITTER','SLFI_EXPIRATION_DATE','SLFI_MIN_EXPIRATION_DATE','SLFI_UPLOAD_INVESTORS'];
                keys.forEach((key) => {
                  if (this.data[key] === undefined) {
                    this.$set(this.data, key, key === 'SLFI_UPLOAD_INVESTORS' ? [] : '');
                  }
                });
              },
            };
          components:
            - name: UploadInvestorsConfirmationForm
              key: '@/projects/slfi/uploadInvestorsConfirmationForm/UploadInvestorsConfirmationForm.vue'
            - name: SlfiCaseHeader
              key: '@/projects/slfi/shared/components/SlfiCaseHeader.vue'
          ignoreMustache: true
