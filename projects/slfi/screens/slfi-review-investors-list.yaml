title: slfi-review-investors-list
description: Review Investors List second task
type: FORM
config:
  - name: Review Investors List
    items:
      - uuid: a1111111-1111-4111-8111-111111111103
        component: VueComponentRenderTemplate
        editor-component: VueComponentEditor
        editor-control: VueComponentEditor
        label: Vue component Editor
        inspector: []
        config:
          icon: fas fa-pencil-ruler
          interactive: true
          componentName: ReviewInvestorsList
          contentVue: '<ReviewInvestorsList v-model="data" :submit="submit" />'
          handlerVue: |
            return {
              created() {
                if (!this.data) { return; }
                ['SLFI_INVESTORS_GRID','SLFI_FLAG_CANCEL_CASE','SLFI_BACK_FORM'].forEach((key) => {
                  if (this.data[key] === undefined) {
                    this.$set(this.data, key, key === 'SLFI_INVESTORS_GRID' ? [] : '');
                  }
                });
              },
            };
          components:
            - name: ReviewInvestorsList
              key: '@/projects/slfi/reviewInvestorsList/ReviewInvestorsList.vue'
            - name: ReviewInvestorsActions
              key: '@/projects/slfi/reviewInvestorsList/components/ReviewInvestorsActions.vue'
            - name: SlfiCaseHeader
              key: '@/projects/slfi/shared/components/SlfiCaseHeader.vue'
            - name: SlfiInvestorsGrid
              key: '@/projects/slfi/shared/components/SlfiInvestorsGrid.vue'
          ignoreMustache: true
